<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report - CivicFix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-small">
        <div class="form-header">
            <a href="index.html" class="back-link">← Back to Dashboard</a>
            <h1>📝 Submit New Report</h1>
        </div>

        <form id="standaloneReportForm" class="standalone-form">
            <div class="form-group">
                <label for="reportTitle">Title *</label>
                <input type="text" id="reportTitle" placeholder="Brief description of the issue" required>
            </div>

            <div class="form-group">
                <label for="reportDescription">Description *</label>
                <textarea id="reportDescription" rows="4" placeholder="Provide details about the issue..." required></textarea>
            </div>

            
            </div>

            <div class="form-group">
                <label for="reportPhoto">Upload Photo</label>
                <input type="file" id="reportPhoto" accept="image/*" capture="environment">
                <div id="photoPreview"></div>
            </div>

            <div class="form-group">
                <label>Location</label>
                <button type="button" id="getLocationBtn2" class="btn-secondary">📍 Use Current Location</button>
                <div id="locationDisplay" class="location-display"></div>
                <input type="text" id="manualLocation" placeholder="Or enter address manually">
            </div>

            <div class="form-group">
                <label for="reportName">Your Name (optional)</label>
                <input type="text" id="reportName" placeholder="Anonymous if left blank">
            </div>

            <button type="submit" class="btn-primary btn-large">Submit Report</button>
        </form>

        <div id="successMessage" class="success-message hidden">
            ✅ Report submitted successfully! Redirecting...
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
